name: Bug Report
description: Create a report to help us improve OpenRend
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue with OpenRend! Please ensure you have tested with the latest release or continuous build before opening a ticket.
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what went wrong.
      placeholder: When importing an MP4 file with variable frame rates, the playback cursor...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Open OpenRend
        2. Drag sample media into Project Media
        3. Split clip at frame 120 using 'S'
        4. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11 (64-bit)
        - Windows 10 (64-bit)
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Graphics Hardware (GPU)
      description: Primary GPU used for Direct3D 11 compositing (e.g. NVIDIA RTX 4070, AMD RX 7800 XT, Intel Iris Xe).
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Copy and paste any error dialog text or console output if available.
      render: shell

