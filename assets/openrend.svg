<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181e28"/>
      <stop offset="50%" stop-color="#0f131a"/>
      <stop offset="100%" stop-color="#090c10"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="legGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" filter="url(#shadow)"/>

  <!-- Subtle Timeline Tracks Pattern Behind Logo -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="2">
    <line x1="80" y1="170" x2="432" y2="170" stroke-dasharray="8 6"/>
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="80" y1="342" x2="432" y2="342" stroke-dasharray="12 8"/>
  </g>

  <!-- Main OpenRend "R" Mark -->
  <g filter="url(#markGlow)">
    <!-- Vertical Timeline Stem -->
    <path d="M128 116 C128 107.16 135.16 100 144 100 H188 C196.84 100 204 107.16 204 116 V396 C204 404.84 196.84 412 188 412 H144 C135.16 412 128 404.84 128 396 Z" fill="url(#cyanGrad)"/>

    <!-- Upper Aperture Loop -->
    <path d="M192 100 H284 C337.02 100 380 142.98 380 196 C380 249.02 337.02 292 284 292 H192 V228 H280 C297.67 228 312 213.67 312 196 C312 178.33 297.67 164 280 164 H192 Z" fill="url(#cyanGrad)"/>

    <!-- Dynamic Diagonal Leg / Render Ray -->
    <path d="M260 252 L368 398 C373.2 405 381.6 409.1 390.4 409.1 H404 C417.8 409.1 426.8 394.8 420.2 382.7 L324 236 Z" fill="url(#legGrad)"/>

    <!-- Precision Playhead / Shutter Core (Gold Chevron) -->
    <path d="M228 168 L276 196 L228 224 Z" fill="url(#accentGrad)"/>

    <!-- Timeline Time Marker Notch -->
    <rect x="116" y="248" width="24" height="16" rx="4" fill="#38bdf8"/>
  </g>
</svg>
