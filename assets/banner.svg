<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Background styling -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c24"/>
      <stop offset="100%" stop-color="#0f1218"/>
    </linearGradient>

    <!-- Clip styling -->
    <linearGradient id="videoClipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="audioClipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="1198" height="418" rx="8" fill="none" stroke="#2a3241" stroke-width="2"/>

  <!-- Left Side: Authentic Branding -->
  <g transform="translate(64, 70)">
    <!-- OpenRend Genuine Logo Icon -->
    <rect width="96" height="96" rx="20" fill="#20262e" stroke="#374151" stroke-width="1.5" filter="url(#subtleShadow)"/>
    <path d="M22 20h30c16 0 25 9 25 21 0 10-5 17-14 20l14 14h-19l-18-19v-5h11c6 0 10-2 10-6s-4-6-10-6H36v42H22Z" fill="#38bdf8"/>
    <path d="m40 41 17 10-17 10Z" fill="#f59e0b"/>

    <!-- Title & Subtitle -->
    <text x="116" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.5">OpenRend</text>
    <text x="118" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500">Fast, Deterministic Windows Non-Linear Video Editor</text>

    <!-- Description -->
    <text x="0" y="146" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
      <tspan x="0" dy="0">Pairs a responsive .NET 10 WPF studio interface with a high-performance</tspan>
      <tspan x="0" dy="24">native C++20 media engine accelerated by Direct3D 11 and FFmpeg.</tspan>
      <tspan x="0" dy="24">1:1 Vegas Pro editing ergonomics with sub-frame audio precision.</tspan>
    </text>

    <!-- Capability Badges -->
    <g transform="translate(0, 230)">
      <!-- Badge 1: C++20 / D3D11 -->
      <rect x="0" y="0" width="144" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
      <circle cx="14" cy="14" r="4" fill="#38bdf8"/>
      <text x="26" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Direct3D 11 / C++20</text>

      <!-- Badge 2: .NET 10 / WPF -->
      <rect x="154" y="0" width="118" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
      <circle cx="168" cy="14" r="4" fill="#818cf8"/>
      <text x="180" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">.NET 10 / WPF</text>

      <!-- Badge 3: Vegas Workflow -->
      <rect x="282" y="0" width="138" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
      <circle cx="296" cy="14" r="4" fill="#f59e0b"/>
      <text x="308" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Vegas Pro Workflow</text>
    </g>
  </g>

  <!-- Right Side: Mini Software Studio Window Mockup -->
  <g transform="translate(600, 36)" filter="url(#subtleShadow)">
    <!-- Window Frame -->
    <rect width="540" height="348" rx="8" fill="#181818" stroke="#2d3748" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect width="540" height="28" rx="8" fill="#141414"/>
    <rect y="20" width="540" height="8" fill="#141414"/>
    <line x1="0" y1="28" x2="540" y2="28" stroke="#262626" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="16" cy="14" r="4" fill="#ef4444"/>
    <circle cx="28" cy="14" r="4" fill="#f59e0b"/>
    <circle cx="40" cy="14" r="4" fill="#10b981"/>
    <text x="60" y="18" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500">Commercial_4K_Master.openrend — OpenRend</text>

    <!-- Menu / Toolbar Strip -->
    <rect y="28" width="540" height="22" fill="#1c1c1c"/>
    <text x="14" y="43" fill="#aaaaaa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">File   Edit   View   Insert   Tools   Options   Help</text>
    <line x1="0" y1="50" x2="540" y2="50" stroke="#262626" stroke-width="1"/>

    <!-- Left Dock: Project Media -->
    <rect x="0" y="50" width="190" height="150" fill="#1a1a1a"/>
    <rect x="0" y="50" width="190" height="20" fill="#222222"/>
    <text x="10" y="64" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="600">Project Media</text>
    <!-- Media Items -->
    <rect x="10" y="78" width="80" height="48" rx="3" fill="#2d3748"/>
    <text x="14" y="120" fill="#cccccc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">Scene_01.mp4</text>
    <rect x="100" y="78" width="80" height="48" rx="3" fill="#2d3748"/>
    <text x="104" y="120" fill="#cccccc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">Dialogue.wav</text>

    <!-- Center/Right Dock: Video Preview -->
    <rect x="190" y="50" width="350" height="150" fill="#141414"/>
    <line x1="190" y1="50" x2="190" y2="200" stroke="#262626" stroke-width="1"/>
    <!-- Preview Viewport -->
    <rect x="202" y="60" width="220" height="124" rx="2" fill="#0a0a0a" stroke="#333333"/>
    <!-- Viewport content (video frame representation) -->
    <rect x="203" y="61" width="218" height="122" fill="#1e293b"/>
    <circle cx="312" cy="115" r="32" fill="#0284c7" opacity="0.4"/>
    <text x="210" y="76" fill="#f59e0b" font-family="'Consolas', 'Courier New', monospace" font-size="10" font-weight="600">00:00:14.28</text>
    <text x="210" y="174" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">1920×1080 | 29.970 fps</text>

    <!-- Master Audio Meter (far right) -->
    <rect x="434" y="60" width="94" height="124" rx="2" fill="#1c1c1c" stroke="#2a2a2a"/>
    <text x="444" y="75" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9">MASTER</text>
    <rect x="444" y="82" width="12" height="92" fill="#0f172a"/>
    <rect x="444" y="112" width="12" height="62" fill="#10b981"/>
    <rect x="460" y="82" width="12" height="92" fill="#0f172a"/>
    <rect x="460" y="106" width="12" height="68" fill="#10b981"/>
    <rect x="460" y="98" width="12" height="8" fill="#f59e0b"/>
    <text x="480" y="114" fill="#aaaaaa" font-family="'Consolas', monospace" font-size="8">-6 dB</text>
    <text x="480" y="144" fill="#aaaaaa" font-family="'Consolas', monospace" font-size="8">-18 dB</text>

    <!-- Bottom Timeline Area -->
    <rect y="200" width="540" height="148" fill="#171717"/>
    <line x1="0" y1="200" x2="540" y2="200" stroke="#333333" stroke-width="1.5"/>

    <!-- Timeline Time Ruler -->
    <rect y="200" width="540" height="20" fill="#202020"/>
    <text x="100" y="214" fill="#777777" font-family="'Consolas', monospace" font-size="9">00:00:00</text>
    <text x="220" y="214" fill="#777777" font-family="'Consolas', monospace" font-size="9">00:00:10</text>
    <text x="340" y="214" fill="#777777" font-family="'Consolas', monospace" font-size="9">00:00:20</text>
    <text x="460" y="214" fill="#777777" font-family="'Consolas', monospace" font-size="9">00:00:30</text>

    <!-- Track 1: Video Header -->
    <rect y="220" width="80" height="42" fill="#222222" stroke="#2d2d2d" stroke-width="0.5"/>
    <text x="8" y="236" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600">01 Video</text>
    <text x="8" y="250" fill="#666666" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8">Vol: 100%</text>

    <!-- Track 1 Clips -->
    <rect x="84" y="222" width="160" height="38" rx="2" fill="url(#videoClipGrad)"/>
    <text x="92" y="238" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600">Scene_01_Wide.mp4</text>
    
    <!-- Crossfade overlap -->
    <path d="M 224 222 L 244 222 L 244 260 L 224 260 Z" fill="#3b82f6" opacity="0.6"/>
    <line x1="224" y1="222" x2="244" y2="260" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="224" y1="260" x2="244" y2="222" stroke="#f59e0b" stroke-width="1.5"/>

    <rect x="224" y="222" width="180" height="38" rx="2" fill="url(#videoClipGrad)" opacity="0.85"/>
    <text x="252" y="238" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600">Scene_02_CloseUp.mp4</text>

    <rect x="412" y="222" width="120" height="38" rx="2" fill="url(#videoClipGrad)"/>
    <text x="420" y="238" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600">B-Roll_Dolly.mp4</text>

    <!-- Track 2: Audio Header -->
    <rect y="264" width="80" height="42" fill="#222222" stroke="#2d2d2d" stroke-width="0.5"/>
    <text x="8" y="280" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600">02 Audio</text>
    <text x="8" y="294" fill="#666666" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="8">Gain: 0.0 dB</text>

    <!-- Track 2 Audio Clips with Waveforms -->
    <rect x="84" y="266" width="220" height="38" rx="2" fill="url(#audioClipGrad)"/>
    <path d="M 90 285 Q 110 270, 130 285 T 170 285 T 210 285 T 250 285 T 290 285" fill="none" stroke="#a7f3d0" stroke-width="1.5" opacity="0.8"/>
    <text x="92" y="278" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600">Studio_Dialogue.wav</text>

    <rect x="312" y="266" width="220" height="38" rx="2" fill="url(#audioClipGrad)"/>
    <path d="M 320 285 Q 340 272, 360 285 T 400 285 T 440 285 T 480 285 T 520 285" fill="none" stroke="#a7f3d0" stroke-width="1.5" opacity="0.8"/>
    <text x="320" y="278" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600">Ambient_Score.wav</text>

    <!-- Playhead Scrub Cursor -->
    <line x1="234" y1="200" x2="234" y2="348" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="228,200 240,200 234,208" fill="#f59e0b"/>
  </g>
</svg>