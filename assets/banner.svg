<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="45%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a0f"/>
    </linearGradient>

    <!-- Ambient Illumination -->
    <radialGradient id="glowLeft" cx="15%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo Gradients -->
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="legGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Clip Gradients -->
    <linearGradient id="clipVideo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="clipAudio" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#glowLeft)"/>
  <rect width="1200" height="420" fill="url(#glowRight)"/>

  <!-- Technical Grid Background -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="120" y1="0" x2="1200" y2="0"/>
    <line x1="240" y1="0" x2="240" y2="420"/>
    <line x1="360" y1="0" x2="360" y2="420"/>
    <line x1="480" y1="0" x2="480" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="720" y1="0" x2="720" y2="420"/>
    <line x1="840" y1="0" x2="840" y2="420"/>
    <line x1="960" y1="0" x2="960" y2="420"/>
    <line x1="1080" y1="0" x2="1080" y2="420"/>
  </g>

  <!-- Left Side: Brand Mark & Identity -->
  <g transform="translate(80, 85)">
    <!-- Logo Container -->
    <rect x="0" y="0" width="130" height="130" rx="30" fill="url(#logoBg)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" filter="url(#cardShadow)"/>

    <!-- Scaled OpenRend Logo Icon -->
    <g transform="translate(18, 18) scale(0.24)">
      <!-- Stem -->
      <path d="M70 40 C70 30 78 22 88 22 H136 C146 22 154 30 154 40 V360 C154 370 146 378 136 378 H88 C78 378 70 370 70 360 Z" fill="url(#cyanGrad)"/>
      <!-- Loop -->
      <path d="M140 22 H240 C295 22 340 67 340 122 C340 177 295 222 240 222 H140 V156 H236 C255 156 270 141 270 122 C270 103 255 88 236 88 H140 Z" fill="url(#cyanGrad)"/>
      <!-- Leg -->
      <path d="M215 180 L325 350 C331 360 341 366 352 366 H370 C385 366 394 350 386 337 L285 180 Z" fill="url(#legGrad)"/>
      <!-- Playhead Core -->
      <path d="M180 92 L230 122 L180 152 Z" fill="url(#accentGrad)"/>
      <!-- Timecode notch -->
      <rect x="56" y="180" width="28" height="18" rx="4" fill="#38bdf8"/>
    </g>

    <!-- Brand Typography -->
    <g transform="translate(155, 38)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="52" fill="#ffffff" letter-spacing="-1">Open<tspan fill="#38bdf8">Rend</tspan></text>
      <text y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="16" fill="#94a3b8" letter-spacing="0.5">HIGH-PERFORMANCE WINDOWS NON-LINEAR VIDEO EDITOR</text>
    </g>
  </g>

  <!-- Technical Pill Badges -->
  <g transform="translate(80, 260)">
    <!-- Badge 1: C++20 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="18" cy="18" r="5" fill="#38bdf8"/>
      <text x="32" y="23" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">C++20 Engine</text>
    </g>

    <!-- Badge 2: .NET 10 WPF -->
    <g transform="translate(192, 0)">
      <rect width="190" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="18" cy="18" r="5" fill="#818cf8"/>
      <text x="32" y="23" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">.NET 10 / WPF</text>
    </g>

    <!-- Badge 3: Direct3D 11 -->
    <g transform="translate(394, 0)">
      <rect width="190" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="18" cy="18" r="5" fill="#10b981"/>
      <text x="32" y="23" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">Direct3D 11 GPU</text>
    </g>

    <!-- Badge 4: Vegas Pro Compatibility -->
    <g transform="translate(596, 0)">
      <rect width="210" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="18" cy="18" r="5" fill="#fbbf24"/>
      <text x="32" y="23" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">Vegas Pro 1:1 Flow</text>
    </g>

    <!-- Badge 5: Zero-Codec Portable -->
    <g transform="translate(818, 0)">
      <rect width="195" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="18" cy="18" r="5" fill="#f43f5e"/>
      <text x="32" y="23" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="13" fill="#e2e8f0">Portable Bundle</text>
    </g>
  </g>

  <!-- Right Side: Stylized Studio Timeline Visual Mockup -->
  <g transform="translate(710, 60)" filter="url(#cardShadow)">
    <!-- Timeline Window Box -->
    <rect width="420" height="175" rx="8" fill="#131720" stroke="#1f2937" stroke-width="1.5"/>

    <!-- Track Header Bar -->
    <rect width="420" height="24" rx="8" fill="#1a202c"/>
    <rect y="16" width="420" height="8" fill="#1a202c"/>
    <circle cx="16" cy="12" r="4" fill="#ef4444"/>
    <circle cx="30" cy="12" r="4" fill="#f59e0b"/>
    <circle cx="44" cy="12" r="4" fill="#10b981"/>
    <text x="60" y="16" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#64748b">TIMELINE // 00:01:24:18 @ 29.97 FPS</text>

    <!-- Video Track 1 -->
    <g transform="translate(12, 36)">
      <!-- Track Header -->
      <rect width="60" height="34" rx="4" fill="#1e293b"/>
      <text x="8" y="21" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#94a3b8">VIDEO 1</text>
      <!-- Clip A -->
      <rect x="68" width="130" height="34" rx="4" fill="url(#clipVideo)"/>
      <text x="76" y="21" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#ffffff">A_ROLL_01.MP4</text>
      <!-- Clip B with Crossfade -->
      <rect x="180" width="160" height="34" rx="4" fill="url(#clipVideo)" opacity="0.95"/>
      <text x="210" y="21" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#ffffff">B_ROLL_02.MP4</text>
      <!-- Reciprocal Curve Overlay -->
      <path d="M180 34 C190 34 195 2 205 2" stroke="#38bdf8" stroke-width="2" fill="none"/>
    </g>

    <!-- Video Track 2 (Overlay / FX) -->
    <g transform="translate(12, 76)">
      <rect width="60" height="34" rx="4" fill="#1e293b"/>
      <text x="8" y="21" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#94a3b8">OVERLAY</text>
      <rect x="120" width="90" height="34" rx="4" fill="#4f46e5" opacity="0.9"/>
      <text x="128" y="21" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#ffffff">TITLE_CARD</text>
    </g>

    <!-- Audio Track 1 -->
    <g transform="translate(12, 116)">
      <rect width="60" height="38" rx="4" fill="#1e293b"/>
      <text x="8" y="23" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#94a3b8">AUDIO 1</text>
      <rect x="68" width="272" height="38" rx="4" fill="url(#clipAudio)"/>
      <!-- Audio Waveform Visual Line -->
      <path d="M72 135 L80 125 L88 140 L96 122 L104 145 L112 120 L120 142 L128 128 L136 138 L144 124 L152 144 L160 126 L168 136 L176 122 L184 140 L192 128 L200 138 L208 120 L216 142 L224 126 L232 136 L240 124 L248 144 L256 128 L264 136 L272 122 L280 140 L288 126 L296 138 L304 124 L312 140 L320 130 L328 135" stroke="#a7f3d0" stroke-width="1.2" fill="none" opacity="0.8"/>
    </g>

    <!-- Timeline Playhead Line (Amber/Gold) -->
    <line x1="200" y1="24" x2="200" y2="160" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="194,24 206,24 200,34" fill="#f59e0b"/>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect y="416" width="1200" height="4" fill="url(#cyanGrad)"/>
</svg>
